<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Interactive read-only map of the Towny teleport network">
  <title>Teleport Network</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">◆</span>
      <div><h1>Teleport Network</h1><p id="summary">Loading network…</p></div>
    </div>
    <div class="controls">
      <div class="segmented" role="group" aria-label="Layout">
        <button id="mapLayout" class="active" type="button">Map</button>
        <button id="circleLayout" type="button">Network</button>
      </div>
      <button id="fitView" type="button">Fit view</button>
    </div>
  </header>

  <main id="stage">
    <svg id="graph" role="img" aria-label="Interactive teleport network">
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
        <marker id="arrow-route" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
          <path d="M0,0 L10,5 L0,10 z"></path>
        </marker>
      </defs>
      <g id="viewport">
        <g id="grid"></g>
        <g id="edges"></g>
        <g id="nodes"></g>
      </g>
    </svg>

    <section class="route-card glass" aria-label="Route planner">
      <div class="eyebrow">Route planner</div>
      <div class="route-inputs">
        <select id="routeFrom" aria-label="Starting city"><option value="">From</option></select>
        <span aria-hidden="true">→</span>
        <select id="routeTo" aria-label="Destination city"><option value="">To</option></select>
      </div>
      <p id="routeResult">Select two cities to display the shortest route.</p>
    </section>

    <section id="cityCard" class="city-card glass" hidden>
      <button id="closeCity" class="close" type="button" aria-label="Close city details">×</button>
      <div class="eyebrow">Selected city</div>
      <h2 id="cityName"></h2>
      <p id="cityCoords"></p>
      <div class="city-stats">
        <div><strong id="cityIn">0</strong><span>incoming</span></div>
        <div><strong id="cityOut">0</strong><span>outgoing</span></div>
      </div>
      <p class="card-note">Green links leave this city. Blue links lead into it.</p>
    </section>

    <div class="legend glass" aria-label="Legend">
      <span><i class="line normal"></i>Teleport link</span>
      <span><i class="line route"></i>Selected route</span>
      <span><i class="node available"></i>Capacity available</span>
      <span><i class="node full"></i>At capacity</span>
    </div>

    <div id="loading" class="loading">Loading teleport network…</div>
    <div id="error" class="error" hidden></div>
  </main>

  <script src="viewer.js"></script>
</body>
</html>
